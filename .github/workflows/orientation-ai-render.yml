name: Orientation AI free natural-voice video

on:
  push:
    branches:
      - orientation-ai-voice
    paths:
      - 'orientation-ai-video/**'
      - '.github/workflows/orientation-ai-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    if: github.repository == 'Emmanuel1812/TandartsWebsite'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated project branch
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free voice and video dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input 'edge-tts>=7,<9' 'mutagen>=1.47,<2' 'Pillow>=10,<13' 'imageio-ffmpeg>=0.5,<1'
          sudo ln -sf "$(python -c 'from imageio_ffmpeg import get_ffmpeg_exe; print(get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          ffmpeg -version | head -n 1

      - name: Render MP4 with Andrew's natural voice
        run: python orientation-ai-video/render.py --voice en-US-AndrewNeural

      - name: Verify video and audio tracks
        run: |
          test -s orientation-ai-video/Orientation_AI_Natural_Voice.mp4
          python - <<'PY'
          import subprocess
          name='orientation-ai-video/Orientation_AI_Natural_Voice.mp4'
          p=subprocess.run(['ffmpeg','-hide_banner','-i',name],capture_output=True,text=True)
          assert 'Video:' in p.stderr and 'Audio:' in p.stderr, p.stderr[-1500:]
          print('Verified audio + video tracks')
          PY

      - name: Save downloadable video and captions
        uses: actions/upload-artifact@v4
        with:
          name: Orientation-AI-Andrew-MP4
          path: |
            orientation-ai-video/Orientation_AI_Natural_Voice.mp4
            orientation-ai-video/Orientation_AI_Natural_Voice_Subtitles.srt
          retention-days: 7
          if-no-files-found: error
